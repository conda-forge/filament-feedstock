filament_window_system:
  # Keep the existing X11 build everywhere it is currently supported.
  - x11       # [linux and not ppc64le]
  # Start native Wayland support on linux-64, where CI can exercise Vulkan
  # rendering under a headless Weston compositor.
  - wayland   # [linux and x86_64]
  - headless  # [linux and ppc64le]
  - native    # [not linux]
